name: release

# Build a release binary whenever the cargo version changes, package it as
# agentatlas-<version>-<os>-<arch>.tar.gz, and publish a GitHub release — the
# asset naming the installer's release path expects (scripts/install.sh).

on:
  push:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_os: linux
            asset_arch: x64
          - os: macos-latest
            asset_os: macos
            asset_arch: x64
          - os: windows-latest
            asset_os: windows
            asset_arch: x64
    runs-on: ${{ matrix.os }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
      exists: ${{ steps.exists.outputs.exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Read cargo version
        id: ver
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/v\1/p' Cargo.toml | head -1)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether the release already exists
        id: exists
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up Rust
        if: steps.exists.outputs.exists == 'false'
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        if: steps.exists.outputs.exists == 'false'
        run: cargo build --release

      - name: Package asset
        if: steps.exists.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NAME="agentatlas-${VERSION}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}"
          if [ "${{ matrix.asset_os }}" = "windows" ]; then
            cp target/release/agentatlas.exe /tmp/agentatlas
            tar -czf "${NAME}.tar.gz" -C /tmp agentatlas
          else
            tar -czf "${NAME}.tar.gz" -C target/release agentatlas
          fi
          echo "asset=${NAME}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload asset
        if: steps.exists.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: asset-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: agentatlas-*.tar.gz

  publish:
    needs: build
    if: needs.build.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          gh release create "$VERSION" \
            --title "agentatlas $VERSION" \
            --generate-notes \
            assets/agentatlas-*.tar.gz
          echo "published $VERSION"